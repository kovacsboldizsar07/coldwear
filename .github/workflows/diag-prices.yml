name: diag-prices
on: { push: { branches: [diag/prices] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd /tmp && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: cp diag/probe.mjs /tmp/ && cd /tmp && node probe.mjs
